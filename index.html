<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📅 Calendario de Productos</title>
    <style>
        /* ===== ESTILOS GLOBALES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }

        /* ===== CALENDARIO ===== */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .day-cell {
            background: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .day-cell:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            background: #f8f9ff;
        }

        .day-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #333;
        }

        .day-indicator {
            font-size: 0.7rem;
            background: #4CAF50;
            color: white;
            padding: 2px 10px;
            border-radius: 10px;
            margin-top: 5px;
            display: none;
        }

        .day-indicator.active {
            display: inline-block;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 1200px;
            width: 100%;
            padding: 30px;
            position: relative;
            animation: slideIn 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        .modal-header h2 {
            font-size: 1.8rem;
            color: #333;
        }

        .close-btn {
            background: #ff4757;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .close-btn:hover {
            transform: rotate(90deg);
            background: #ff6b81;
        }

        /* ===== PRODUCTOS ===== */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px;
            background: #fafafa;
            transition: all 0.3s;
        }

        .product-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .product-title {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 8px;
            font-weight: 600;
        }

        /* ===== ÁREA DE DROP ===== */
        .drop-zone {
            border: 3px dashed #bbb;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            background: white;
            position: relative;
            cursor: pointer;
        }

        .drop-zone.dragover {
            border-color: #667eea;
            background: #f0f2ff;
            transform: scale(1.02);
        }

        .drop-zone.has-image {
            border-style: solid;
            border-color: #4CAF50;
        }

        .drop-zone img {
            max-width: 100%;
            max-height: 120px;
            border-radius: 8px;
            object-fit: contain;
        }

        .drop-zone .placeholder {
            color: #999;
            font-size: 0.9rem;
        }

        .drop-zone .placeholder i {
            font-size: 2rem;
            display: block;
            margin-bottom: 8px;
        }

        /* ===== INPUTS ===== */
        .product-name-input {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            margin: 10px 0;
            transition: border-color 0.3s;
        }

        .product-name-input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* ===== BOTONES TIKTOK ===== */
        .tiktok-buttons-container {
            margin-top: 10px;
        }

        .tiktok-btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .tiktok-btn {
            background: #000;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .tiktok-btn:hover {
            transform: scale(1.05);
            background: #161616;
        }

        .tiktok-btn .btn-label {
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tiktok-btn .remove-btn {
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 0.6rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 4px;
        }

        .add-tiktok-btn {
            background: #25F4EE;
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 5px;
        }

        .add-tiktok-btn:hover {
            background: #00d4cc;
            transform: scale(1.05);
        }

        .tiktok-link-input {
            width: 100%;
            padding: 6px 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        .tiktok-link-input:focus {
            outline: none;
            border-color: #25F4EE;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .calendar-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
                padding: 10px;
            }

            .day-cell {
                min-height: 60px;
                padding: 10px;
            }

            .day-number {
                font-size: 1.2rem;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            .calendar-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* ===== SCROLLBAR ===== */
        .modal-content::-webkit-scrollbar {
            width: 8px;
        }

        .modal-content::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .modal-content::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📅 Calendario de Productos</h1>
    <div class="calendar-grid" id="calendarGrid"></div>
</div>

<!-- ===== MODAL ===== -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">📆 Día <span id="dayNumberDisplay">1</span></h2>
            <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <div class="products-grid" id="productsContainer"></div>
    </div>
</div>

<script>
    // ============================================================
    //  CONFIGURACIÓN INICIAL
    // ============================================================
    const DAYS = 31;

    // Estructura de datos: guarda los productos de cada día
    const calendarData = {};

    // Inicializar días vacíos
    for (let d = 1; d <= DAYS; d++) {
        calendarData[d] = {
            products: Array(10).fill(null).map(() => ({
                name: '',
                image: null,        // URL de la imagen (base64)
                tiktokButtons: []   // [{ label: 'Laura', link: 'https://...' }]
            }))
        };
    }

    // ============================================================
    //  RENDERIZAR CALENDARIO
    // ============================================================
    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        for (let d = 1; d <= DAYS; d++) {
            const cell = document.createElement('div');
            cell.className = 'day-cell';
            cell.dataset.day = d;

            const hasProducts = calendarData[d].products.some(p => p.image !== null || p.name !== '');

            cell.innerHTML = `
                <div class="day-number">${d}</div>
                <span class="day-indicator ${hasProducts ? 'active' : ''}">📦</span>
            `;

            cell.addEventListener('click', () => openModal(d));
            grid.appendChild(cell);
        }
    }

    // ============================================================
    //  ABRIR / CERRAR MODAL
    // ============================================================
    let currentDay = 1;

    function openModal(day) {
        currentDay = day;
        document.getElementById('dayNumberDisplay').textContent = day;
        document.getElementById('modalOverlay').classList.add('active');
        renderProducts(day);
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        document.getElementById('modalOverlay').classList.remove('active');
        document.body.style.overflow = '';
        renderCalendar(); // Refrescar indicadores
    }

    // Cerrar con ESC
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });

    // Cerrar al hacer clic fuera del contenido
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeModal();
    });

    // ============================================================
    //  RENDERIZAR PRODUCTOS EN MODAL
    // ============================================================
    function renderProducts(day) {
        const container = document.getElementById('productsContainer');
        container.innerHTML = '';

        const products = calendarData[day].products;

        products.forEach((product, index) => {
            const card = document.createElement('div');
            card.className = 'product-card';

            // Drop Zone
            const dropZone = document.createElement('div');
            dropZone.className = `drop-zone ${product.image ? 'has-image' : ''}`;
            dropZone.dataset.productIndex = index;
            dropZone.dataset.day = day;

            if (product.image) {
                dropZone.innerHTML = `<img src="${product.image}" alt="Producto" />`;
            } else {
                dropZone.innerHTML = `
                    <div class="placeholder">
                        <i>📸</i>
                        <span>Arrastra una imagen aquí<br/><small>o haz clic para subir</small></span>
                    </div>
                `;
            }

            // Eventos Drag & Drop
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragover');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleImageUpload(files[0], day, index);
                }
            });

            // Click para subir archivo
            dropZone.addEventListener('click', () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = (e) => {
                    if (e.target.files.length > 0) {
                        handleImageUpload(e.target.files[0], day, index);
                    }
                };
                input.click();
            });

            // Nombre del producto
            const nameInput = document.createElement('input');
            nameInput.type = 'text';
            nameInput.className = 'product-name-input';
            nameInput.placeholder = `Nombre del producto ${index + 1}`;
            nameInput.value = product.name || '';
            nameInput.addEventListener('input', (e) => {
                calendarData[day].products[index].name = e.target.value;
                renderCalendar();
            });

            // Contenedor de botones TikTok
            const btnContainer = document.createElement('div');
            btnContainer.className = 'tiktok-buttons-container';
            btnContainer.innerHTML = `
                <div style="font-size:0.8rem; color:#666; margin-bottom:4px;">
                    🔗 Botones TikTok
                </div>
                <div class="tiktok-btn-group" id="tiktokGroup_${day}_${index}"></div>
                <button class="add-tiktok-btn" onclick="addTikTokButton(${day}, ${index})">
                    + Agregar botón TikTok
                </button>
            `;

            // Renderizar botones existentes
            renderTikTokButtons(day, index);

            // Armar tarjeta
            card.appendChild(dropZone);
            card.appendChild(nameInput);
            card.appendChild(btnContainer);

            container.appendChild(card);
        });
    }

    // ============================================================
    //  MANEJAR IMAGEN (subir y guardar)
    // ============================================================
    function handleImageUpload(file, day, productIndex) {
        if (!file) return;
        if (!file.type.startsWith('image/')) {
            alert('Por favor, sube solo imágenes.');
            return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
            const imageData = e.target.result;
            calendarData[day].products[productIndex].image = imageData;
            renderProducts(day);
            renderCalendar();
        };
        reader.readAsDataURL(file);
    }

    // ============================================================
    //  BOTONES TIKTOK
    // ============================================================
    function renderTikTokButtons(day, productIndex) {
        const group = document.getElementById(`tiktokGroup_${day}_${productIndex}`);
        if (!group) return;

        const buttons = calendarData[day].products[productIndex].tiktokButtons || [];
        group.innerHTML = '';

        buttons.forEach((btn, idx) => {
            const btnEl = document.createElement('button');
            btnEl.className = 'tiktok-btn';
            btnEl.innerHTML = `
                <span class="btn-label">${btn.label || 'Sin nombre'}</span>
                <span class="remove-btn" onclick="removeTikTokButton(${day}, ${productIndex}, ${idx})">✕</span>
            `;
            btnEl.addEventListener('click', (e) => {
                // Evitar que se dispare al hacer clic en el botón de eliminar
                if (e.target.classList.contains('remove-btn')) return;
                if (btn.link) {
                    window.open(btn.link, '_blank');
                } else {
                    alert('Este botón no tiene un link configurado.');
                }
            });
            group.appendChild(btnEl);
        });
    }

    function addTikTokButton(day, productIndex) {
        const label = prompt('✏️ Nombre del botón (ej: Laura):');
        if (label === null) return;

        const link = prompt('🔗 Link de TikTok Shop:');
        if (link === null) return;

        // Validar URL (opcional)
        let finalLink = link;
        if (!link.startsWith('http://') && !link.startsWith('https://')) {
            finalLink = 'https://' + link;
        }

        calendarData[day].products[productIndex].tiktokButtons.push({
            label: label.trim() || 'Sin nombre',
            link: finalLink
        });

        renderTikTokButtons(day, productIndex);
        renderCalendar();
    }

    function removeTikTokButton(day, productIndex, buttonIndex) {
        if (!confirm('¿Eliminar este botón TikTok?')) return;
        calendarData[day].products[productIndex].tiktokButtons.splice(buttonIndex, 1);
        renderTikTokButtons(day, productIndex);
        renderCalendar();
    }

    // ============================================================
    //  INICIAR APLICACIÓN
    // ============================================================
    renderCalendar();
</script>

</body>
</html>
